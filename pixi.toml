[workspace]
name = "earthquake-visualization-dashboard"
version = "1.0.0"
description = "Interactive dashboard for visualizing earthquake data from the USGS Earthquake Catalog API"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
# Web app
dash = ">=2.14"
# Data handling — pandas pinned <3: dtype validation assumes pandas 2's object string dtype
pandas = ">=2,<3"
geopandas = "*"
requests = "*"
# Visualization
altair = ">=5,<6"   # matches the deployed env (5.5.0); altair 6 emits Vega-Lite v6 specs
vega_datasets = "*"

[pypi-dependencies]
dash-vega-components = "*"
earthquake_dashboard = { path = ".", editable = true }

# The marimo front-end, over the same DataLoader / DataVisualizer as the Dash app.
[feature.alt.dependencies]
marimo = "*"

# Task names deliberately differ from the marimo executable: a task named
# "marimo" would shadow the binary, so extra arguments get appended to the task's
# own command and silently produce a mangled invocation.
[feature.alt.tasks]
# --no-sandbox is load-bearing. The notebook's PEP 723 block installs
# earthquake-dashboard from git so molab can resolve it, and `marimo run` obeys
# that metadata by re-launching under `uv run --isolated` -- serving whatever
# main holds instead of this checkout. #43's map-brush fix was invisible here
# for exactly that reason while Dash, on the editable install, had it.
marimo-app = "marimo run apps/marimo_app.py --no-sandbox"
marimo-edit = "marimo edit apps/marimo_app.py --no-sandbox"

[feature.dev.dependencies]
ruff = "*"
pytest = "*"
ipykernel = "*"
jupyter = "*"

[tasks]
app    = "python -m earthquake_dashboard.app"
lint   = "ruff check src tests apps scripts"
format = "ruff format src tests apps scripts"
test   = "pytest tests/ -v --tb=short"
# Flatten the package into a Plotly Cloud upload bundle (dist/plotly/ plus a .zip).
bundle = "python scripts/bundle_plotly.py"
# Re-embed the marimo grid layout after rearranging cells; molab only ever sees the .py.
layout = "python scripts/embed_layout.py"
check  = { depends-on = ["lint", "test"] }

[environments]
default = { features = ["dev"], solve-group = "default" }
alt = { features = ["dev", "alt"] }
